name: Terraform DevSecOps Pipeline (Code Quality Only)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------
  # STAGE 1: SECURITY SCANNING & VALIDATION
  # -------------------------------------------------------------
  security-and-validate:
    name: Security Scan & Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Secret Scanning
      - name: Secret Scanning with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 2. IaC Security Scanning (SAST)
      - name: Infrastructure Security Scanning (Checkov)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: . 
          framework: terraform
          soft_fail: true 

      # 3. Terraform Validation
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./environment

      - name: Terraform Format Check
        run: terraform fmt -check -recursive
        working-directory: .

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./environment

      # 4. Terraform Linter (TFLint)
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        
      - name: Run TFLint
        run: tflint -f compact --recursive
        working-directory: .

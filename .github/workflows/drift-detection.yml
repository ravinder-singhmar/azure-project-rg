name: Terraform Drift Detection

# Ye pipeline roz raat 12 baje (UTC) apne aap chalegi
on:
  schedule:
    - cron: '0 0 * * *'
  
  # 'workflow_dispatch' ka matlab hai ki aap GitHub website par jaakar isko manually button daba kar bhi chala sakte hain
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  drift-check:
    name: Check for Infrastructure Drift
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./environment

      # Sabse zaroori step: -detailed-exitcode
      # Ye Terraform ko batata hai ki agar Cloud mein aur Code mein koi farak (drift) mile, 
      # toh pipeline ko FAIL kar do taaki hume email par alert mil jaye!
      - name: Terraform Plan (Check for Drift)
        run: terraform plan -detailed-exitcode
        working-directory: ./environment
